# Правила маршрутизации системных и сетевых журналов для rsyslog.
# Журналы выбранных сетевых устройств записываются в каталоги /var/log/R.
# Для события NetPing дополнительно вызывается внешний HTTP endpoint.
# Расположение: /etc/rsyslog.d/50-default.conf
# Вход: сообщения системного журнала, принятые rsyslog.
# Выход: файлы журналов в /var/log/R и HTTP-запрос по событию NetPing.
# Пример проверки: rsyslogd -N1 -f /etc/rsyslog.d/50-default.conf
# Применение: подключается службой rsyslog при запуске демона.
# @author  Pavel Dik: paveldik@gmail.com
# @version 1.0
#  Default rules for rsyslog.
#
#                       For more information see rsyslog.conf(5) and /etc/rsyslog.conf

module(load="omprog")

#Шаблон пути размещения лога для сетевых устройств на основе ip адреса
$template AUTHLOG,"/var/log/R/%fromhost-ip%/auth.log"
$template SYSLOG,"/var/log/R/%fromhost-ip%/syslog"

#$template netping,"%TIMESTAMP:::date-rfc3339% [%fromhost-ip%] %pri-text% %syslogtag%%msg%\n"

# Логи устройств из "наших" подсеток перенаправляем в папку /var/log/R/%IP%/
if ( ( $fromhost-ip=="185.93.88.88"
    OR $fromhost-ip=="88.147.88.88"
    OR $fromhost-ip=="88.147.88.123" )
    AND $syslogfacility-text != "auth"
    and $syslogfacility-text != "authpriv"
    and $fromhost-ip != "127.0.0.1" )
  then {
# Пишем в файл
    ?SYSLOG
}

# Логи устройств с площадки msk перенаправляем в папку /var/log/R/MSK/
if ( ( $fromhost-ip startswith "192.168.2."
    OR $fromhost-ip startswith "192.168.3."
    OR $fromhost-ip startswith "192.168.4."
    OR $fromhost-ip startswith "192.168.17." )
    AND $syslogfacility-text != "auth"
    and $syslogfacility-text != "authpriv" )
  then {
# Пишем в файл и прекращаем обработку этого сообщения
    action(type="omfile" file="/var/log/R/MSK/syslog")
    stop
}

# Логи устройств площадки site1 перенаправляем в папку /var/log/R/185.93.88.88/
if ( ( $fromhost-ip startswith "192.168.201." )
    AND $syslogfacility-text != "auth"
    and $syslogfacility-text != "authpriv" )
  then {
# Пишем в файл и прекращаем обработку этого сообщения
    action(type="omfile" file="/var/log/R/185.93.88.88/syslog")
    stop
}

# Логи NetPing'а кладем в папку netping
if ( ( $fromhost-ip startswith "192.168.15.123" ) )
  then {
# Пишем в файл и прекращаем обработку этого сообщения
    action( type="omfile" file="/var/log/R/netping/syslog" )
	# Триггер срабатывания датчика на первом входе нетпинга:
    if $msg contains 'IO1=1' then {
       action( type="omfile" file="/var/log/R/netping_on/syslog" )
# А тут дергаем скрипт на внешнем сервере для сохранения фотки с камеры по событию нетпинга
       action ( type="omprog"
              binary="/usr/bin/curl -o /dev/null --connect-timeout 4 --silent --head --write-out '%{http_code}\n' http://scripts.mysite.ru/netping/netping_event.php >/dev/null" )
    }
    stop
}


# Далее стандартные (дефолтные) параметры syslog


#
# First some standard log files.  Log by facility.
#
auth,authpriv.*                 /var/log/auth.log
*.*;auth,authpriv.none          -/var/log/syslog
#cron.*                         /var/log/cron.log
#daemon.*                       -/var/log/daemon.log
kern.*                          -/var/log/kern.log
#lpr.*                          -/var/log/lpr.log
mail.*                          -/var/log/mail.log
#user.*                         -/var/log/user.log

#
# Logging for the mail system.  Split it up so that
# it is easy to write scripts to parse these files.
#
#mail.info                      -/var/log/mail.info
#mail.warn                      -/var/log/mail.warn
mail.err                        /var/log/mail.err

#
# Some "catch-all" log files.
#
#*.=debug;\
#       auth,authpriv.none;\
#       news.none;mail.none     -/var/log/debug
#*.=info;*.=notice;*.=warn;\
#       auth,authpriv.none;\
#       cron,daemon.none;\
#       mail,news.none          -/var/log/messages

#
# Emergencies are sent to everybody logged in.
#
*.emerg                         :omusrmsg:*

#
# I like to have messages displayed on the console, but only on a virtual
# console I usually leave idle.
#
#daemon,mail.*;\
#       news.=crit;news.=err;news.=notice;\
#       *.=debug;*.=info;\
#       *.=notice;*.=warn       /dev/tty8
